name: SENA LUXE security branch checks

on:
  push:
    branches:
      - security/public-private-firestore-split
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Production dependency security audit
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node -e "const a=require('/tmp/npm-audit-production.json'); console.log('Production dependency audit:', JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', fixAvailable=' + JSON.stringify(item.fixAvailable));"
      - name: TypeScript check
        run: npm run lint

      - name: Firestore Rules tests
        run: npm run test:rules

      - name: Build project
        run: npm run build
