name: Import SENA LUXE project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import project ZIP
        run: |
          if [ -f sena-luxe-github-ready.zip ]; then
            mkdir -p .project-import
            unzip -oq sena-luxe-github-ready.zip -d .project-import
            cp -a .project-import/. .
            rm -rf .project-import sena-luxe-github-ready.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import SENA LUXE project files"
            git push
          else
            echo "ZIP already imported; continuing with build."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: sena-luxe-dist
          path: dist/
          if-no-files-found: error
